name: weekly-publish

on:
  schedule:
    - cron: "0 23 * * 0" # 일 23:00 UTC = 월 08:00 KST
  workflow_dispatch:
    inputs:
      mock:
        description: "fixtures 데이터로 실행 (API 키 불필요)"
        type: boolean
        default: false

concurrency:
  group: weekly-publish
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/cache@v4
        with:
          path: .fonts
          key: noto-fonts-v1

      - run: pip install -r requirements.txt

      - name: Run pipeline
        run: python -m src.main ${{ inputs.mock == true && '--mock' || '' }}
        env:
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          BIZINFO_KEY: ${{ secrets.BIZINFO_KEY }}
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
          PAGES_BASE_URL: https://jwchoi061217-web.github.io/-

      # docs/ 에는 발행물과 함께 docs/state/seen_gov.json(이미 내보낸 공고 기록)이 들어간다.
      # 이 파일이 커밋되어야 다음 주에 같은 공고가 또 올라가지 않는다.
      - name: Commit outputs
        run: |
          git config user.name "modu-news-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/
          git diff --cached --quiet || git commit -m "publish: $(date -u -d '+9 hours' +%F) 주간 발행"
          git push
