name: weekly-publish

# 정기 실행(schedule)은 꺼 두었다 — 수집은 사무실 PC의 작업 스케줄러
# '모두의뉴스_수집'(windows/run_collect.ps1)이 매주 월요일에 맡는다.
#   · Secrets 가 하나도 등록되지 않아 8주 연속 실패했다.
#   · PC 와 Actions 가 같은 주에 둘 다 수집하면 docs/ 가 서로 어긋나 push 가 충돌한다.
# Secrets 를 등록하고 Actions 로 되돌리려면 아래 schedule 주석을 풀고
# PC 쪽 작업은 해제한다(둘 중 하나만).
on:
  # schedule:
  #   - cron: "0 23 * * 0" # 일 23:00 UTC = 월 08:00 KST
  workflow_dispatch:
    inputs:
      mock:
        description: "fixtures 데이터로 실행 (API 키 불필요, docs 는 바뀌지 않음)"
        type: boolean
        default: false

concurrency:
  group: weekly-publish
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/cache@v4
        with:
          path: .fonts
          key: noto-fonts-v1

      - run: pip install -r requirements.txt

      - name: Run pipeline
        run: python -m src.main ${{ inputs.mock == true && '--mock' || '' }}
        env:
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          BIZINFO_KEY: ${{ secrets.BIZINFO_KEY }}
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
          PAGES_BASE_URL: https://jwchoi061217-web.github.io/-
          PYTHONIOENCODING: utf-8

      # docs/ 에는 발행물과 함께 docs/state/seen_gov.json(이미 내보낸 공고 기록)과
      # docs/gov/archive.json(아카이브)이 들어간다. 커밋되어야 다음 주로 이어진다.
      - name: Commit outputs
        run: |
          git config user.name "modu-news-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/
          git diff --cached --quiet || git commit -m "publish: $(date -u -d '+9 hours' +%F) 주간 발행"
          git push
